<title>המשח״כ – משחק חברי הכנסת ה-26</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap">
<style>
:root{--bg:#0B1230;--p:#1B2547;--p2:#2A3560;--mut:#9AA6C8;--g1:#E3B964;--g2:#FBE7B0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 50% at 50% 0,#1B2757,var(--bg));background-color:var(--bg);color:#fff;font-family:Heebo,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.hidden{display:none!important}
.badge{border:1.5px solid var(--g1);border-radius:10px;overflow:hidden;text-align:center;max-width:330px;margin:8px auto 10px}
.badge small{display:block;padding:4px;font-weight:800;font-size:15px}
.badge b{display:block;background:linear-gradient(90deg,var(--g1),var(--g2));color:#1a1405;font-size:46px;font-weight:900;padding:0 0 4px;line-height:1.2}
.sub{text-align:center;color:var(--mut);margin:0 0 18px}
button,.btn{font:800 17px Heebo,Arial,sans-serif;border-radius:12px;border:2px solid var(--g1);background:transparent;color:var(--g2);padding:12px 16px;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible,.fc:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.gold{background:linear-gradient(90deg,var(--g1),var(--g2));color:#1a1405;border-color:transparent}
.big{display:block;width:100%;margin:0 0 10px;padding:18px}
.big small{display:block;font-weight:400;font-size:14px;opacity:.85}
.modes{display:flex;gap:8px;margin-bottom:10px}.modes button{flex:1;padding:8px}
.modes .on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#1a1405}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.st{flex:1;background:var(--p);border-radius:10px;padding:4px 8px;text-align:center}.st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--mut)}
.top button{padding:6px 12px;font-size:14px;min-height:44px}
.prog{height:8px;background:var(--p2);border-radius:5px;overflow:hidden;margin:4px 0 8px}#pb{height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
svg.hemi{display:block;width:100%;max-width:420px;margin:0 auto}
#inp,#nick{width:100%;font:700 21px Heebo,Arial,sans-serif;padding:13px 14px;border-radius:12px;border:2px solid var(--g1);background:var(--p);color:#fff;margin:6px 0 10px}
#fcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fc{background:var(--p);border-radius:10px;border:2px solid transparent;border-inline-start:7px solid var(--c);padding:7px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.fc.sel{border-color:var(--g1);border-inline-start-color:var(--c)}
.fc span{font-weight:600;font-size:14px}.fc b{font-size:22px}.fc small{font-size:12px;color:var(--mut);font-weight:400}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.s{position:relative;min-height:56px;border-radius:8px;background:var(--p2);color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center;padding:17px 3px 4px;font-size:13px;font-weight:600;line-height:1.2}
.s.on{background:linear-gradient(#0005,#0005),var(--c);color:#fff;animation:fl .6s}
.s i{position:absolute;top:3px;inset-inline-end:5px;font-size:10px;font-style:normal;font-weight:400}
@keyframes fl{0%{filter:brightness(2)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){.s.on{animation:none}}
.panel{background:var(--p);border-radius:12px;padding:12px;margin:12px 0}
.panel h2{margin:0 0 8px;font-size:18px;color:var(--g2)}
.row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--p2)}.row:last-child{border:0}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row b{font-variant-numeric:tabular-nums}
.score{text-align:center;font-size:64px;font-weight:900;color:var(--g2);line-height:1}.score small{font-size:24px;color:var(--mut)}
.note{color:var(--mut);font-size:14px;text-align:center;margin:6px 0}
#img{position:fixed;inset:0;background:#000d;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#img img{max-width:100%;max-height:70%;border-radius:10px}
.logo,.mini img{-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 70.7%);mask-image:radial-gradient(circle,#000 58%,transparent 70.7%)}
.logo{display:block;width:min(340px,88%);margin:0 auto 4px}.logo.sm{width:180px}
.mini{display:flex;align-items:center;gap:10px;margin-bottom:8px}.mini img{width:52px;height:52px}.mini b{font-size:18px;color:var(--g2)}
.credit{text-align:center;color:var(--mut);font-size:13px;margin-top:28px}
.fh{display:flex;gap:10px;align-items:center;background:var(--p);border-radius:10px;border-inline-start:8px solid var(--c);padding:10px 12px;margin-bottom:8px}.fh>b{flex:1;font-size:18px}.fh span b{color:var(--g2);font-size:18px}
#tu{position:fixed;inset:0;background:#0B1230f0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.shk{font-size:clamp(38px,12vw,68px);font-weight:900;color:var(--g2);-webkit-text-fill-color:transparent;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;line-height:1.2}
#flash{height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;margin:6px 0 -2px;opacity:0;transform:scale(.97);transition:opacity .15s,transform .15s}#flash.on{opacity:1;transform:none}
details{margin-top:8px;color:var(--mut);font-size:14px}
</style>
</head>

  const sendButton=$('send');

  const name=$('nick').value.trim().slice(0,20)||'אנונימי';
  try{localStorage.setItem('nick',name)}catch(e){}
  sendButton.disabled=true;
  msg.textContent='שולחים…';
  try{
    await db.collection('scores').add({name,score:last.score,left:last.left});
    scoreSubmitted=true;
    msg.textContent='נשלח ללוח!';
    sendButton.textContent='שיח"כת אותה!';
  }catch(e){
    console.error('Leaderboard submit failed:',e);
    msg.textContent='לא הצלחנו לשלוח, נסו שוב';
    sendButton.disabled=false;
  }
};
/* JPEG */
async function jpeg(){
  try{await document.fonts.load('900 40px Heebo')}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.direction='rtl';x.textAlign='center';
  const F=(w,s)=>x.font=`${w} ${s}px Heebo,Arial,sans-serif`;
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1B2757');g.addColorStop(1,'#0B1230');x.fillStyle=g;x.fillRect(0,0,W,H);
  const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=LOGO});if(im){const lc=document.createElement('canvas');lc.width=lc.height=290;const y=lc.getContext('2d');y.drawImage(im,0,0,290,290);y.globalCompositeOperation='destination-in';const rg=y.createRadialGradient(145,145,0,145,145,205);rg.addColorStop(.58,'#000');rg.addColorStop(1,'rgba(0,0,0,0)');y.fillStyle=rg;y.fillRect(0,0,290,290);x.drawImage(lc,395,20)}
  x.fillStyle='#FBE7B0';F(900,190);x.fillText(found+'/120',540,470);
  x.fillStyle='#9AA6C8';F(600,36);x.fillText('זמן: '+fmt(TOTAL-left),540,525);
  SEATS.forEach((s,i)=>{x.fillStyle=MK[i].found?MK[i].color:'#2A3560';x.beginPath();x.arc(540+(s.x-200)*1.7,570+(s.y-10)*1.7,8,0,7);x.fill()});
  PT.forEach((p,k)=>{const n=MK.filter(m=>m.pi===k&&m.found).length,col=k%2,row=Math.floor(k/2),X=col?120:600,Y=990+row*56;
    x.fillStyle=p[2];x.fillRect(X,Y-30,10,40);x.fillStyle='#fff';x.textAlign='left';F(700,34);x.fillText(p[0],X+26,Y);x.textAlign='right';x.fillStyle='#FBE7B0';x.fillText(n+'/'+p[1],X+360,Y);x.textAlign='center'});
  x.fillStyle='#9AA6C8';F(600,30);x.fillText('כמה חברי כנסת אתם מכירים? שחקו במשח״כ',540,1300);F(600,24);x.fillText('נוצר על ידי יואב וידל',540,1336);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.92));
}
$('share').onclick=async()=>{blob=await jpeg();$('pic').src=URL.createObjectURL(blob);$('img').classList.remove('hidden')};
$('cls').onclick=()=>$('img').classList.add('hidden');
$('dl').onclick=()=>{const a=document.createElement('a');a.href=$('pic').src;a.download='mishach.jpg';a.click()};
renderLB();
